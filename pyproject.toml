[project]
name = "qsearch"
version = "0.1.0"
description = "Question image search engine with OCR and vector similarity"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # CPU is the safe default. CUDA, glibc and compiler versions are not PEP 508
    # markers, so scripts/sync_environment.py performs hardware-aware upgrades.
    "faiss-cpu>=1.7.4",
    "transformers>=4.49.0",
    # Required by Transformers device_map="auto" for multi-GPU OCR inference.
    "accelerate>=0.26.0",
    "sentence-transformers>=2.2.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.1",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",  # memory-aware worker sizing
    "scikit-image>=0.21.0",
    "python-Levenshtein>=0.21.0",
    # WebUI. Streamlit is pinned rather than floored: st.dialog needs >=1.31 and
    # st.fragment needs >=1.37, and the custom CSS targets data-testid attributes
    # that are only semi-stable across versions. See requirements.txt for detail.
    "streamlit==1.63.0",
    "streamlit-shortcuts>=0.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsearch"]

[tool.hatch.build]
src-layout = true

# uv uses CPU-only PyTorch wheels for the portable/default environment. The
# environment synchronizer replaces these with a compatible CUDA build only
# after checking the NVIDIA driver, glibc and architecture.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.qsearch.runtime]
minimum-glibc = "2.28"
minimum-gcc = "9.0"
faiss-gpu-version = "1.15.0"
faiss-gpu-minimum-cuda = "12.9"

[[tool.qsearch.runtime.cuda]]
name = "cu126"
minimum-version = "12.6"
pytorch-index = "https://download.pytorch.org/whl/cu126"

[[tool.qsearch.runtime.cuda]]
name = "cu118"
minimum-version = "11.8"
pytorch-index = "https://download.pytorch.org/whl/cu118"
